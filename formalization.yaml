status:
  scope: >-
    In arbitrary-universe commutative UFDs, associated primes of the principal
    quotient equal minimal primes over the principal ideal for every generator,
    including zero and subsingleton cases, without normalization, nonzero,
    domain or Noetherian premises. A quotient-spectrum point is associated
    over the quotient ring, or has an exact singleton quotient-ring annihilator,
    exactly when its forward comap image is minimal over that ideal; both
    criteria cover every generator. For compatible actions over commutative
    semirings, associated primes contract along any algebra map and reflect
    along a surjective one; colon contraction allows a semiring target and no
    surjectivity. The normalized-factor classification, factor-to-minimal-prime
    equivalence and component equivalence apply to commutative semirings with
    UniqueFactorizationMonoid. They require a nonzero generator and the caller's
    NormalizationMonoid; repeated factors count as one value. The factor equivalence
    sends each factor value p to the principal ideal generated by p. The geometric
    result is an Equiv into order-dual components
    of the zero-locus subspace, not a homeomorphism or a classification of arbitrary
    ideals. Mathlib's associated primes use radicals of annihilators; the separate
    exact-annihilator criterion is specific to these principal quotients, not a
    generic radical-equals-annihilator principle.
  sorry_count: 0

review:
  status: reviewed

