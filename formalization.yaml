version: "v0.4"

project:
  name: Minimal primes over principal ideals in commutative UFDs
  description: >-
    Classifies minimal primes over nonzero principal ideals by normalized
    irreducible factors and relates them to order-dual irreducible components.
    For every generator, identifies the associated primes of its principal
    quotient with the minimal primes over its principal ideal.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Atlas]
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: Formal Frontier Lean precursor for Exercise 3.7.H
    authors: [Formal Frontier Agents]
    id: Formal Frontier Exercise 3.7.H research precursor
    type: project-created Lean research precursor
    location: Internal source research record
    relationship: adapts
    note: >-
      Atlas authored the adapted Lean proof expression; its precursor chose
      normalization locally and assumed a domain. Subsequent Formal Frontier AI agents
      contributed the reusable classification and caller-normalization repair.
      This API takes the caller's normalization without a separate domain
      hypothesis.
  - title: Foundations of Algebraic Geometry
    authors: [Ravi Vakil]
    type: book
    location: Exercise 3.7.H (October 21, 2025 draft)
    relationship: background
    note: >-
      Mathematical motivation only, not a contributor to this Lean development;
      no source text or assets are redistributed here.
  - title: 'The Rising Sea: Foundations of Algebraic Geometry'
    authors: [Ravi Vakil]
    type: book
    location: Exercise 6.6.F
    relationship: background
    note: >-
      Exact-annihilator examples motivate the principal-quotient comparison;
      the theorem instead uses mathlib's radical-of-annihilator associated primes.

automation:
  methods:
    - method: agent
      framework: Lean and Lake
      tool_setup: AI-assisted Lean formalization, examples and documentation
  notes: >-
    Formal Frontier AI agents developed the reusable classification, its
    caller-normalization interface and the principal-quotient comparison.
    Atlas assembled named examples and adapted the native documentation recipe
    through Integral Closure from Anchor's original Ideal Completion tooling.

status:
  scope: >-
    In arbitrary-universe commutative UFDs, associated primes of the principal
    quotient equal minimal primes over the principal ideal for every generator,
    including zero and subsingleton cases, without normalization, nonzero,
    domain or Noetherian premises. The normalized-factor classification and
    factor/component equivalences require a nonzero generator and the caller's
    NormalizationMonoid; repeated factors count as one value. The geometric
    result is an Equiv into order-dual components of the zero-locus subspace,
    not a homeomorphism or a classification of arbitrary ideals.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: Ideal.minimalPrimes_span_singleton_eq_normalizedFactors
      file: MinimalPrimes/Principal.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: Ideal.normalizedFactorsEquivMinimalPrimes
      file: MinimalPrimes/Principal.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: Ideal.normalizedFactorsEquivMinimalPrimes_apply
      file: MinimalPrimes/Principal.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: Ideal.normalizedFactorsEquivIrreducibleComponents
      file: MinimalPrimes/IrreducibleComponents.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: Ideal.associatedPrimes_quotient_span_singleton_eq_minimalPrimes
      file: MinimalPrimes/AssociatedPrincipal.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]

fidelity:
  divergences: >-
    Generalizes the original scratch proof by retaining caller normalization
    and removing its redundant extra domain assumption. The geometric result
    is an Equiv into order-dual irreducible components of a zero-locus subspace.
    The principal-quotient comparison applies to every generator without caller
    normalization; mathlib's associated primes use radicals of annihilators,
    not an exact-prime-annihilator classification.

review:
  status: independent review pending

acknowledgements: >-
  Builds on pinned mathlib under Apache-2.0. Original source research by Atlas;
  reusable classification, caller-normalization repair, associated-prime
  comparison, and module/test and documentation contributions by Formal Frontier
  AI agents. Atlas added named examples and the documentation assembly; the
  adapter preserves credit to Anchor's original ideal-completion recipe in
  docs/README.md. Detailed source coverage is maintained outside this reusable
  library.
