version: "v0.4"

project:
  name: Minimal primes over principal ideals in commutative UFDs
  description: >-
    Classifies minimal primes over nonzero principal ideals by normalized
    irreducible factors and relates them to order-dual irreducible components.
    For every generator, identifies the associated primes of its principal
    quotient with the minimal primes over its principal ideal, and characterizes
    quotient-spectrum points by associated primes and exact annihilators.
    Associated primes also transport along compatible algebra maps.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Atlas]
  license: Apache-2.0

repository:
  role: substantive-development

sources:
