    authors: [Ravi Vakil]
    type: book
    location: Exercise 3.7.H (October 21, 2025 draft)
    relationship: background
    note: >-
      Mathematical motivation only, not a contributor to this Lean development;
      no source text or assets are redistributed here.
  - title: 'The Rising Sea: Foundations of Algebraic Geometry'
    authors: [Ravi Vakil]
    type: book
    location: Exercise 6.6.F
    relationship: background
    note: >-
      Exact-annihilator examples motivate the principal-quotient comparison;
      both the radical-of-annihilator associated-prime criterion and a separate
      exact quotient-ring annihilator criterion are proved here.

