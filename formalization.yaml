fidelity:
  divergences: >-
    Generalizes the original scratch proof by retaining caller normalization
    and removing its redundant extra domain assumption. The geometric result
    is an Equiv into order-dual irreducible components of a zero-locus subspace.
    The principal-quotient comparisons apply to every generator without caller
    normalization. Mathlib's associated primes use radicals of annihilators;
    the separate exact-annihilator criterion is specific to these principal
    quotients, not a generic radical-equals-annihilator principle.

review:
  status: agent-reviewed mathematical development

