    authors: [Formal Frontier Agents]
    id: Formal Frontier Exercise 3.7.H research precursor
    type: project-created Lean research precursor
    location: Internal source research record
    relationship: adapts
    note: >-
      Atlas authored the adapted Lean proof expression; its precursor chose
      normalization locally and assumed a domain. Subsequent Formal Frontier AI agents
      contributed the reusable classification and caller-normalization repair.
      This API takes the caller's normalization without a separate domain
