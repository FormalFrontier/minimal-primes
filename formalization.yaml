version: "v0.4"

project:
  name: Minimal primes over principal ideals in commutative UFDs
  description: >-
    Classifies minimal primes over nonzero principal ideals by normalized
    irreducible factors, with equivalences to minimal primes and order-dual
    irreducible components of the prime-spectrum zero-locus subspace.
  authors: [Formal Frontier Agents]
  responsible_maintainers: [Atlas]
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: Formal Frontier Lean precursor for Exercise 3.7.H
    authors: [Formal Frontier Agents]
    id: Formal Frontier Exercise 3.7.H research precursor
    type: project-created Lean research precursor
    location: Internal source research record
    relationship: adapts
    note: >-
      Atlas authored the adapted Lean proof expression; its precursor chose
      normalization locally and assumed a domain. Subsequent Formal Frontier AI agents
      contributed the reusable classification and caller-normalization repair.
      This API takes the caller's normalization without a separate domain
      hypothesis. The exact precursor mapping is preserved in the private
      source and publication-readiness research records.
  - title: Foundations of Algebraic Geometry
    authors: [Ravi Vakil]
    type: book
    location: Exercise 3.7.H (October 21, 2025 draft)
    relationship: background
    note: >-
      Mathematical motivation only, not a contributor to this Lean development;
      no source text or assets are redistributed here. Earlier original-source
      inspection belongs to the source research record, not a coverage claim here.

automation:
  methods:
    - method: agent
      framework: Formal Frontier Hive Tasks with Lean and Lake
      tool_setup: AI-assisted Lean formalization and independent Task review
  notes: >-
    Formal Frontier AI agents developed the reusable classification and repaired
    its caller-normalization interface. Earlier mathematical, module/test and
    standalone documentation changes received independent agent review and
    owner acceptance; these do not approve later artifacts. Atlas assembled
    named examples and native documentation, adapting through Integral Closure
    a recipe from Anchor's original Ideal Completion tooling. No model identity,
    costs or human review are claimed.

status:
  scope: >-
    Nonzero principal ideals in arbitrary-universe commutative UFDs with the
    caller-supplied NormalizationMonoid; repeated factors count as one value.
    This does not classify arbitrary ideals or supply a homeomorphism.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: Ideal.minimalPrimes_span_singleton_eq_normalizedFactors
      file: MinimalPrimes/Principal.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: Ideal.normalizedFactorsEquivMinimalPrimes
      file: MinimalPrimes/Principal.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: Ideal.normalizedFactorsEquivMinimalPrimes_apply
      file: MinimalPrimes/Principal.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: Ideal.normalizedFactorsEquivIrreducibleComponents
      file: MinimalPrimes/IrreducibleComponents.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]

fidelity:
  divergences: >-
    Generalizes the original scratch proof by retaining caller normalization
    and removing its redundant extra domain assumption. The geometric result
    is an Equiv into order-dual irreducible components of a zero-locus subspace.

review:
  status: agent-reviewed mathematical development
  notes: >-
    Mathematical development, normalization repair, and module/test changes
    received prior independent reviews and owner acceptance. The earlier
    standalone documentation and metadata were also accepted. These historical
    reviews do not certify later artifacts. Exact assembly review, findings,
    acceptance and publication state are recorded separately for each commit
    and tree. Schema validity is not review or release acceptance.

acknowledgements: >-
  Builds on pinned mathlib under Apache-2.0. Original source research by Atlas;
  reusable classification, caller-normalization repair and earlier module/test
  and documentation contributions by Formal Frontier AI agents. Formal Frontier
  Agents provided independent reviews. Atlas added named examples and the
  documentation assembly; the adapter preserves credit to Anchor's original
  ideal-completion recipe in docs/README.md. Detailed source coverage is
  maintained outside this reusable library.
