status:
  scope: >-
    In arbitrary-universe commutative UFDs, associated primes of the principal
    quotient equal minimal primes over the principal ideal for every generator,
    including zero and subsingleton cases, without normalization, nonzero,
    domain or Noetherian premises. A quotient-spectrum point is associated
    over the quotient ring, or has an exact singleton quotient-ring annihilator,
    exactly when its forward comap image is minimal over that ideal; both
    criteria cover every generator. For compatible actions over commutative
    semirings, associated primes contract along any algebra map and reflect
    along a surjective one; colon contraction allows a semiring target and no
    surjectivity. The normalized-factor classification, factor-to-minimal-prime
    equivalence and component equivalence apply to commutative semirings with
    UniqueFactorizationMonoid. They require a nonzero generator and the caller's
    NormalizationMonoid; repeated factors count as one value. The factor equivalence
    sends each factor value p to the principal ideal generated by p. The geometric
    result is an Equiv into order-dual components
    of the zero-locus subspace, not a homeomorphism or a classification of arbitrary
    ideals. Mathlib's associated primes use radicals of annihilators; the separate
    exact-annihilator criterion is specific to these principal quotients, not a
    generic radical-equals-annihilator principle. In any preorder, finite ambient
    height of x gives a well-founded strict order on its lower interval. An antitone
    natural-number sequence of spectrum points over a commutative semiring stabilizes
    when its initial point has finite ambient order height. The commutative-ring ideal
    interface requires every term prime and only an initial Ideal.FiniteHeight instance;
    initial primeness excludes that class's unit-ideal exception. Both interfaces give
    one common index for tail constancy and for the all-index ideal infimum. They add
    no UFD, domain, global finite-dimension, ambient well-foundedness, Noetherian,
    Artinian or nontriviality premise. The relevant height is on the prime spectrum,
    not Order.height on the full ideal lattice. For a prime element p in a commutative
    ring with WfDvdMonoid, the ideal span {p} has height at most one. If p belongs to
    nonZeroDivisors R, that height is one; this includes every prime element in a
    commutative domain with WfDvdMonoid. The upper bound requires no domain, UFM,
    Noetherian or separate nontriviality premise and does not apply to arbitrary
    principal ideals. WfDvdMonoid is well-foundedness of DvdNotUnit, equivalent to
    ACCP for principal ideals in domains, not merely irreducible factorization.
    For any field K, the infinite-variable polynomial examples in
    MinimalPrimesTest/RingTheory/Ideal/PrincipalPrimeHeight.lean instantiate all three
    principal-prime height results at X₀, derive initial FiniteHeight from height one,
    and apply the ideal chain interface to a sequence staying at (X₀) through any
    index d and genuinely dropping to zero at d+1. The interface supplies one common
    index for tail constancy and the all-index infimum. The ambient ring has infinite
    Krull dimension. The separate infinite-variable argument in the finite-height
    ring client's module documentation remains a mathematical sketch. No
    negative-Noetherianity certificate is included in the principal-prime client;
    infinite Krull dimension alone does not establish non-Noetherianity.
    For an integral homomorphism f : R →+* S of commutative rings in independent
    universes, ringKrullDim S ≤ ringKrullDim R, with equality when f is injective.
    Without injectivity, ringKrullDim S = ringKrullDim (R ⧸ RingHom.ker f).
    A given Algebra R S that is integral and faithful gives
    ringKrullDim R = ringKrullDim S. These statements use the full WithBot ℕ∞
    codomain, including bottom for the zero ring and top for infinite dimension.
    The finite-product successor identity uses WithBot ℕ∞ products and sums over
    nonempty subsets, with equality in ℕ∞ and no index equality, nonempty-index,
    nonbottom or finite-value hypothesis.
    For arbitrary given preorders α : Type u and β : Type v in independent universes
    and points a : α, b : β, the canonical binary Prod.Lex preorder satisfies
    height (toLex (a,b)) = height a * Hβ + height b and
    coheight (toLex (a,b)) = coheight a * Hβ + coheight b in ℕ∞, with the same
    Hβ = (Set.univ : Set β).chainHeight (· < ·), the whole second factor's strict-chain
    vertex cardinality. This coefficient is not its Krull dimension, the rank of b,
    or its carrier cardinality. Weak comparison is first-coordinate strict comparison
    or first-coordinate equality followed by second-coordinate weak comparison; strict
    comparison uses second-coordinate strict comparison instead. Distinct weakly equivalent
    first coordinates give incomparable fibres, while fixed-first fibres retain distinct
    weakly equivalent second points and their mutual weak comparisons. This is not the
    dependent-function equality-or-strict partial order or the pointwise product order.
    The point-rank bridges identify height a and coheight a with the strict-chain vertex
    heights of the original Iio a and Ioi a for the given strict relation, without a
    closed-segment decomposition that fails for general preorders. There are no linearity,
    antisymmetry, global nonemptiness, decidable-equality, bottom/top, finiteness,
    finite-height or attainment premises. The given points inhabit the factors; empty
    strict segments have height zero, 0 * ⊤ = 0, and unbounded finite chains need not
    attain infinite height. The middle point of Fin 3 ×ₗ Fin 3 has both height and
    coheight four, rather than the pointwise values two; its second-factor weight is
    three, not dimension two.
    For a supplied section of a finite dependent family of given preorders, height
    and coheight in the original pointwise product equal the sums of coordinate
    ranks in ENat. Empty indices and infinite or unattained ranks are included,
    without antisymmetry, fibre inhabitation or finite-height hypotheses.
