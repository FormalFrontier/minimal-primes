acknowledgements: >-
  Builds on Mathlib (Apache-2.0) and prior Formal Frontier formalizations of
  principal-ideal, associated-prime and finite-height prime-chain results. The
  principal-prime height proofs use Mathlib's maximal-power factorization,
  prime-ideal height criterion and regular-element height lower bound.
  The dependent lexicographic chain-height formula uses Mathlib's stock Sigma relation,
  chain-height, set-cardinality and finite-subunion APIs and generalizes the earlier
  Formal Frontier binary lexicographic-sum union core.
  The finite-support Sigma dimension formula consumes that whole height formula and the
  earlier Formal Frontier dimension/height finite cuts, with Mathlib's bottom-aware
  successor and finite-sum arithmetic.
  The strict lexicographic order generalizes Chris Hughes's PiLex formalization,
  using partialOrderOfSO by Jeremy Avigad, Mario Carneiro and Yury Kudryashov.
  Its finite dependent-product dimension formula consumes the whole dependent
  lexicographic height formula and the bottom-aware successor comparison.
  The scalar successor identity reuses Mathlib's whole finite-product expansion
  Finset.prod_add_one, finite-sum single-point separation and WithBot coercion APIs.
  Binary lexicographic point ranks use Mathlib's Prod.Lex preorder, point-rank,
  inherited-interval and chain-height APIs, including Set.chainHeight_flip, with the
  earlier Formal Frontier lexicographic product and disjoint cross-comparable union formulas.
  The finite pointwise rank formulas compose the binary rank identities with
  Mathlib's order-isomorphism rank invariance, canonical finite-Pi splitting and
  reindexing, and finite-sum APIs.
  AI agents developed the Lean code and examples.
