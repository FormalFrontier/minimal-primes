version: "v0.4"

project:
  name: Minimal primes over principal ideals in semirings with unique factorization
  description: >-
    Classifies minimal primes over nonzero principal ideals in commutative
    semirings with unique factorization by normalized irreducible factor values.
    Relates these factors to order-dual irreducible components of principal zero loci.
    For principal quotients in commutative rings with unique factorization, identifies
    associated primes with minimal primes over the principal ideal for every generator,
    and characterizes quotient-spectrum points by associated primes and exact annihilators.
    For arbitrary dependent families of semifields, classifies all prime ideals of
    the product by ultrafilters, with zero-set membership, evaluation and germ-kernel
    bridges, and finite-coordinate and infinite non-coordinate controls. The same
    equivalence is a homeomorphism for the Zariski and existing Stone topologies,
    with both basis pullback laws and dense coordinate primes.
    For arbitrary filters and independently universed dependent monoids with zero,
    the total-section filter product is reduced exactly when its reduced fibres
    form a filter member. For dependent semiring fibres, equips the existing
    total-section Filter.Product with semiring operations,
    fibrewise maps and principal-filter restriction equivalences. Ultrafilters give
    division semirings and semifields with pointwise inversion. The section-map
    kernels are the existing zero-set ideals, compatibly with constant-family germs.
    For arbitrary dependent type families, the total-section filter product is
    nontrivial exactly when a total section exists and nontrivial fibres occur frequently.
    Associated primes also transport along compatible algebra maps. In commutative
    rings with well-founded DvdNotUnit, prime generators give principal ideals of height
    at most one, with height one for non-zero-divisors and for prime elements in domains.
    Finite ambient initial height gives well-founded lower intervals in preorders and stabilization
    of antitone prime chains over commutative semirings, with an ideal interface over
    commutative rings using only initial FiniteHeight and primeness at every index.
    Both chain interfaces identify the all-index ideal infimum at the same tail index.
    For integral homomorphisms of arbitrary commutative rings in independent universes,
    bounds target Krull dimension by source dimension, with equality for injective maps.
    Without injectivity, the target has the dimension of the source modulo the kernel.
    A faithful integral algebra has the dimension of its base ring for its given algebra
    structure. These results use the full WithBot ℕ∞ dimension, including zero rings
    and infinite dimension. Minimal primes over arbitrary ideals of finite dependent
    products of commutative semirings correspond to labelled coordinate minimal primes,
    using the evaluation-image coordinates of Ideal.piOrderIso. Evaluation comap
    transports minimality over arbitrary ideals without finiteness of the index.
    The finite classification includes empty indices, subsingleton factors and whole
    base ideals, and retains the labels of repeated isomorphic factors.
    For arbitrary finite sets and WithBot ℕ∞ values, the bottom-aware successor of
    the nonempty-subset product sum equals the product of successors in ℕ∞,
    including empty indices and arbitrary bottom and top values.
    For finite dependent families of preorders in independent universes, the height
    and coheight of a supplied section are the sums of its coordinate ranks in ENat,
    for the original pointwise order, including empty indices and infinite ranks.
  authors: [Formal Frontier Agents]
  license: Apache-2.0

highlights:
  - title: Prime spectra of products of semifields
    statement: >-
      The prime spectrum of an arbitrary dependent product of semifields is
      canonically homeomorphic to the Stone space of ultrafilters on its index type.
    declarations:
      - declaration: PrimeSpectrum.piHomeomorphUltrafilter
        file: MinimalPrimes/RingTheory/Spectrum/Prime/PiUltrafilter.lean
  - title: Ideals in products of division semirings
    statement: >-
      Every left ideal of an arbitrary dependent product of division semirings
      is the zero-set ideal of its characteristic-test filter.
    declarations:
      - declaration: Ideal.piIdeal_piFilter
        file: MinimalPrimes/RingTheory/Ideal/PiFilter.lean
  - title: Nontrivial dependent reduced products
    statement: >-
      For every filter and independently universed dependent type family, the total-section
      reduced product is nontrivial exactly when a total section exists and nontrivial
      fibres occur frequently.
    declarations:
      - declaration: Filter.Product.nontrivial_iff
        file: MinimalPrimes/Order/Filter/Product/Nontrivial.lean
  - title: Krull dimension and chain cardinalities of lexicographic sums
    statement: >-
      For arbitrary subsets of independently universed dependent preorders whose active
      indices form a finite strict chain, the stock lexicographic Sigma dimension is the
      active-index dimension plus the sum of active fiber dimensions. Empty support and
      infinite fiber dimensions are included. For two arbitrary preorder subsets, the
      tagged lexicographic union has the maximum of their dimensions and their sum plus one.
      For arbitrary subsets of independently universed dependent sums with raw relations,
      chain height is the supremum of finite sums of fiber heights, assuming only pairwise
      comparability and irreflexivity of the active indices. Empty fibers and infinite heights
      are allowed, with no transitivity, global order, finiteness or attainment hypothesis.
    declarations:
      - declaration: Order.krullDim_toLex_sigma
        file: MinimalPrimes/Order/KrullDimension.lean
      - declaration: Order.krullDim_toLex_sum
        file: MinimalPrimes/Order/KrullDimension.lean
      - declaration: Set.chainHeight_sigma_lex
        file: MinimalPrimes/Order/ChainHeight.lean

  - title: Krull dimension of finite dependent lexicographic products
    statement: >-
      For arbitrary subsets of independently universed given preorders over a finite
      linearly ordered index, lexicographic dimension is the WithBot map of ENat
      decrement applied to the product of the shifted fibre dimensions. Product and
      addition are in WithBot ENat, with only the decrement in ENat. Empty index,
      empty fibres and infinite dimensions are included. The canonical partial order
      is equality or strict lexicographic comparison with equality prefixes; it needs
      only strict less-than relations on the fibres and agrees as a whole record with
      Mathlib's construction when the fibres have partial orders.
    declarations:
      - declaration: Order.krullDim_toLex_pi
        file: MinimalPrimes/Order/KrullDimension.lean
      - declaration: Pi.Lex.isStrictOrderOfLT
        file: MinimalPrimes/Order/PiLex.lean
      - declaration: Pi.Lex.partialOrderOfLT
        file: MinimalPrimes/Order/PiLex.lean
      - declaration: Pi.Lex.partialOrderOfLT_lt
        file: MinimalPrimes/Order/PiLex.lean
      - declaration: Pi.Lex.partialOrderOfLT_le_iff
        file: MinimalPrimes/Order/PiLex.lean
      - declaration: Pi.Lex.partialOrderOfLT_eq
        file: MinimalPrimes/Order/PiLex.lean


