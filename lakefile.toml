name = "minimal-primes"
version = "0.1.0"
defaultTargets = ["MinimalPrimes", "MinimalPrimesTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "e37d88a26f3791ed5a93daa1f949af1021b8d103"

[[lean_lib]]
name = "MinimalPrimes"

[[lean_lib]]
name = "MinimalPrimesTest"
globs = ["MinimalPrimesTest.+"]
